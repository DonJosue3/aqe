<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex" />

    <title>African Queen Empire — Administration</title>

    <link rel="stylesheet" href="./admin.css" />
  </head>

  <body>
    <!-- Écran de connexion -->

    <section id="login-screen">
      <div class="login-box">
        <img src="/aqe/images/aqelogo.png" alt="African Queen Empire" class="logo" />

        <h1>Administration</h1>

        <p>Espace réservé au propriétaire</p>

        <form id="login-form">
          <label for="password"> Mot de passe </label>

          <input id="password" type="password" autocomplete="current-password" required />

          <button type="submit">Se connecter</button>
        </form>

        <div id="login-message" class="message"></div>
      </div>
    </section>

    <!-- ADMINISTRATION -->

    <section id="cms-screen" class="hidden">
      <div class="admin-panel">
        <h1>Administration</h1>

        <p>Bienvenue dans l'espace d'administration African Queen Empire.</p>

        <button id="logout-button">Se déconnecter</button>
      </div>
    </section>
    <script src="./admin.js"></script>
  </body>
</html>
