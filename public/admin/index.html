<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex" />

    <title>African Queen Empire — Administration</title>

    <link rel="stylesheet" href="./admin.css" />
  </head>

  <body>

    <!-- ==================================================
         CONNEXION
    ================================================== -->

    <section id="login-screen">

      <div class="login-box">

        <img
          src="/aqe/images/aqelogo.png"
          alt="African Queen Empire"
          class="logo"
        />

        <h1>Administration</h1>

        <p>Espace réservé au propriétaire</p>

        <form id="login-form">

          <label for="password">
            Mot de passe
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">
            Se connecter
          </button>

        </form>

        <div id="login-message" class="message"></div>

      </div>

    </section>


    <!-- ==================================================
         ADMINISTRATION
    ================================================== -->

    <section id="cms-screen" class="hidden">

      <div class="admin-container">

        <header class="admin-header">

          <div>
            <h1>Administration</h1>

            <p>
              Bienvenue dans l'espace d'administration
              African Queen Empire.
            </p>
          </div>

          <button id="logout-button" class="logout-button">
            Se déconnecter
          </button>

        </header>


        <!-- ==================================================
             MENU PRINCIPAL DE L'ADMINISTRATION
        ================================================== -->

        <div class="admin-navigation">

          <button
            id="show-products-button"
            class="admin-tab active"
            type="button"
          >
            Produits
          </button>

          <button
            id="show-menu-button"
            class="admin-tab"
            type="button"
          >
            Menu
          </button>

        </div>


        <!-- ==================================================
             PRODUITS
        ================================================== -->

        <section
          id="products-section"
          class="admin-section"
        >

          <div class="section-header">

            <div>
              <h2>Produits</h2>

              <p>
                Gestion des produits de la boutique.
              </p>
            </div>

          </div>

          <div id="products-editor">

            <p class="loading">
              Chargement des produits...
            </p>

          </div>

        </section>


        <!-- ==================================================
             MENU
        ================================================== -->

        <section
          id="menu-section"
          class="admin-section hidden"
        >

          <div class="section-header">

            <div>
              <h2>Menu</h2>

              <p>
                Gestion des plats et boissons.
              </p>
            </div>

          </div>


          <!-- CATÉGORIES -->

          <div class="menu-categories">

            <button
              type="button"
              class="menu-category-button active"
              data-category="platsDuJour"
            >
              Plats du jour
            </button>

            <button
              type="button"
              class="menu-category-button"
              data-category="specialites"
            >
              Spécialités
            </button>

            <button
              type="button"
              class="menu-category-button"
              data-category="boissons"
            >
              Boissons
            </button>

            <button
              type="button"
              class="menu-category-button"
              data-category="petitDejeuner"
            >
              Petit déjeuner
            </button>

            <button
              type="button"
              class="menu-category-button"
              data-category="petitsPlus"
            >
              Petits plus
            </button>

            <button
              type="button"
              class="menu-category-button"
              data-category="patisseries"
            >
              Pâtisseries
            </button>

            <button
              type="button"
              class="menu-category-button"
              data-category="portions"
            >
              Portions
            </button>

            <button
              type="button"
              class="menu-category-button"
              data-category="pizza"
            >
              Pizza
            </button>

          </div>


          <!-- ÉDITEUR -->

          <div id="menu-editor">

            <p class="loading">
              Chargement du menu...
            </p>

          </div>


          <div class="save-area">

            <button
              id="save-menu-button"
              class="save-button"
              type="button"
            >
              Enregistrer les modifications
            </button>

            <div id="menu-message" class="message"></div>

          </div>

        </section>

      </div>

    </section>


    <script src="./admin.js"></script>

  </body>
</html>
